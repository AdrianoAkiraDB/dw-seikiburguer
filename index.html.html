<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingest√£o Operacional - Seiki Burguer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <header class="mb-8 text-center border-b border-slate-800 pb-6">
      <h1 class="text-3xl font-bold text-amber-500">Seiki Burguer - Ingest√£o de Dados</h1>
      <p class="text-slate-400 text-sm mt-1">Alimenta√ß√£o do Data Warehouse (Compras e Despesas)</p>
    </header>

    <!-- Navega√ß√£o por Abas -->
    <div class="flex border-b border-slate-700 mb-8 space-x-2">
      <button onclick="switchTab('compras')" id="tab-compras" class="px-4 py-3 font-medium text-amber-500 border-b-2 border-amber-500 focus:outline-none">1. Compras (Insumos)</button>
      <button onclick="switchTab('custos')" id="tab-custos" class="px-4 py-3 font-medium text-slate-400 focus:outline-none">2. Custos Operacionais</button>
      <button onclick="switchTab('cadastros')" id="tab-cadastros" class="px-4 py-3 font-medium text-slate-400 focus:outline-none">3. Novo Insumo / Fornecedor</button>
    </div>

    <!-- Aba 1: Compras de Insumos -->
    <section id="sec-compras" class="space-y-6">
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
        <h2 class="text-xl font-semibold mb-4 text-amber-400">Registrar Compra de Insumo</h2>
        <form id="form-compras" onsubmit="salvarCompra(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Data da Compra</label>
            <input type="date" id="compra-data" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Fornecedor</label>
            <select id="compra-fornecedor" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white"></select>
          </div>
          <div class="md:col-span-2">
            <label class="block text-sm font-medium text-slate-300 mb-1">Insumo</label>
            <select id="compra-insumo" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white"></select>
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Quantidade (kg, un, lit)</label>
            <input type="number" step="0.001" id="compra-qtd" oninput="calcularTotalCompra()" required placeholder="Ex: 5.122" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Pre√ßo Unit√°rio / kg (R$)</label>
            <input type="number" step="0.01" id="compra-preco-unit" oninput="calcularTotalCompra()" required placeholder="Ex: 28.90" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" />
          </div>
          <div class="md:col-span-2 bg-slate-950 p-4 rounded-lg border border-slate-800 flex justify-between items-center">
            <span class="text-slate-400 font-medium">Valor Total da Compra:</span>
            <span id="compra-total-exibicao" class="text-2xl font-bold text-amber-400">R$ 0,00</span>
          </div>
          <button type="submit" class="md:col-span-2 bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-lg transition">Registrar Compra</button>
        </form>
      </div>
    </section>

    <!-- Aba 2: Custos Operacionais -->
<section id="sec-custos" class="space-y-6 hidden">
  <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
    <h2 class="text-xl font-semibold mb-4 text-amber-400">Registrar Custo / SaÌda Di·ria</h2>
    <form id="form-custos" onsubmit="salvarCusto(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Data</label>
        <input type="date" id="custo-data" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Categoria do Custo</label>
        <select id="custo-coluna" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
          <option value="custo_fixo">Custo Fixo</option>
          <option value="custo_variavel">Custo Vari·vel</option>
          <option value="insumos_cmv">Insumos/CMV Avulso</option>
          <option value="gastos_casa">Retirada Pessoal / Gastos Casa</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Tipo / DescriÁ„o (ex: G·s, Luz, Aluguel)</label>
        <input type="text" id="custo-descricao" required placeholder="Ex: G·s de Cozinha" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Valor Pago (R$)</label>
        <input type="number" step="0.01" id="custo-valor" required placeholder="Ex: 115.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" />
      </div>
      <button type="submit" class="md:col-span-2 bg-amber-600 hover:bg-amber-500 text-white font-bold py-3 rounded-lg transition">Registrar Despesa</button>
    </form>
  </div>
</section>

    <!-- Aba 3: Cadastros -->
    <section id="sec-cadastros" class="space-y-6 hidden">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Novo Insumo -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
          <h3 class="text-lg font-semibold mb-4 text-amber-400">Cadastrar Insumo</h3>
          <form onsubmit="cadastrarInsumo(event)" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1">Nome do Insumo</label>
              <input type="text" id="novo-insumo-nome" required placeholder="Ex: Carne Smash 100g" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" />
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1">Unidade de Medida</label>
              <select id="novo-insumo-unidade" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white">
                <option value="kg">Quilograma (kg)</option>
                <option value="un">Unidade (un)</option>
                <option value="litro">Litro (l)</option>
              </select>
            </div>
            <button type="submit" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 rounded-lg transition">Salvar Insumo</button>
          </form>
        </div>

        <!-- Novo Fornecedor -->
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
          <h3 class="text-lg font-semibold mb-4 text-amber-400">Cadastrar Fornecedor</h3>
          <form onsubmit="cadastrarFornecedor(event)" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1">Nome do Fornecedor</label>
              <input type="text" id="novo-fornecedor-nome" required placeholder="Ex: A√ßougue Boi Gordo" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-white" />
            </div>
            <button type="submit" class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-2.5 rounded-lg transition">Salvar Fornecedor</button>
          </form>
        </div>
      </div>
    </section>
  </div>

  <script>
    const SUPABASE_URL = "https://hlhewevxbxuvfxkjwqkv.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhsaGV3ZXZ4Ynh1dmZ4a2p3cWt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyNjkxNDMsImV4cCI6MjA5ODg0NTE0M30.0QuAYDE2MjUHsUlzoOjUEAcSV29KEEGHOj-_Jr29gOc";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.querySelectorAll('input[type="date"]').forEach(input => input.value = new Date().toISOString().split('T')[0]);

    function switchTab(tab) {
      ['compras', 'custos', 'cadastros'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'px-4 py-3 font-medium text-slate-400 focus:outline-none';
      });
      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'px-4 py-3 font-medium text-amber-500 border-b-2 border-amber-500 focus:outline-none';
    }

    function calcularTotalCompra() {
      const qtd = parseFloat(document.getElementById('compra-qtd').value) || 0;
      const preco = parseFloat(document.getElementById('compra-preco-unit').value) || 0;
      const total = qtd * preco;
      document.getElementById('compra-total-exibicao').innerText = `R$ ${total.toFixed(2).replace('.', ',')}`;
    }

    async function carregarSelects() {
      const { data: fornecedores } = await _supabase.from('dim_fornecedores').select('fornecedor_id, nome_fornecedor');
      const { data: insumos } = await _supabase.from('dim_insumos').select('insumo_id, nome_insumo, unidade_medida');

      document.getElementById('compra-fornecedor').innerHTML = fornecedores?.map(f => `<option value="${f.fornecedor_id}">${f.nome_fornecedor}</option>`).join('') || '';
      document.getElementById('compra-insumo').innerHTML = insumos?.map(i => `<option value="${i.insumo_id}">${i.nome_insumo} (${i.unidade_medida})</option>`).join('') || '';
    }

    async function salvarCompra(e) {
  e.preventDefault();
  const insumo_id = parseInt(document.getElementById('compra-insumo').value);
  const quantidade = parseFloat(document.getElementById('compra-qtd').value);
  const valor_unitario = parseFloat(document.getElementById('compra-preco-unit').value);
  const valor_total = quantidade * valor_unitario;

  const payload = {
    data_compra: document.getElementById('compra-data').value,
    fornecedor_id: parseInt(document.getElementById('compra-fornecedor').value),
    insumo_id: insumo_id,
    quantidade: quantidade,
    valor_unitario: valor_unitario,
    valor_total: valor_total
  };

  const { error } = await _supabase.from('fct_compras_insumos').insert([payload]);
  
  if (!error) { 
    alert('Compra registrada com sucesso!'); 
    e.target.reset(); 
  } else { 
    alert('Erro: ' + error.message); 
  }
}

    async function salvarCusto(e) {
  e.preventDefault();
  const campo = document.getElementById('custo-coluna').value;
  const valor = parseFloat(document.getElementById('custo-valor').value);
  const descricao = document.getElementById('custo-descricao').value;
  
  const payload = { 
    data: document.getElementById('custo-data').value,
    descricao: descricao
  };
  payload[campo] = valor;

  const { error } = await _supabase.from('fct_custos_operacionais').insert([payload]);
  if (!error) { alert('Custo registrado com sucesso!'); e.target.reset(); }
  else alert('Erro: ' + error.message);
}

    async function cadastrarInsumo(e) {
      e.preventDefault();
      const { error } = await _supabase.from('dim_insumos').insert([{
        nome_insumo: document.getElementById('novo-insumo-nome').value,
        unidade_medida: document.getElementById('novo-insumo-unidade').value
      }]);
      if (!error) { alert('Insumo criado!'); e.target.reset(); carregarSelects(); }
      else alert('Erro: ' + error.message);
    }

    async function cadastrarFornecedor(e) {
      e.preventDefault();
      const { error } = await _supabase.from('dim_fornecedores').insert([{
        nome_fornecedor: document.getElementById('novo-fornecedor-nome').value
      }]);
      if (!error) { alert('Fornecedor criado!'); e.target.reset(); carregarSelects(); }
      else alert('Erro: ' + error.message);
    }

    carregarSelects();
  </script>
</body>
</html>
